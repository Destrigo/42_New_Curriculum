# =============================================================================
# NGINX Configuration for Inception Project
# =============================================================================

# Run as nginx user
user nginx;

# Auto-detect number of CPU cores
worker_processes auto;

# Error log location
error_log /var/log/nginx/error.log warn;

# PID file location
pid /run/nginx/nginx.pid;

events {
    # Maximum simultaneous connections per worker
    worker_connections 1024;
}

http {
    # Include MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript 
               text/xml application/xml application/xml+rss text/javascript;

    # ==========================================================================
    # HTTPS Server Block
    # ==========================================================================
    server {
        # Listen on port 443 with SSL
        listen 443 ssl;
        listen [::]:443 ssl;

        # Server name - will be replaced by setup script or use env var
        server_name login.42.fr;

        # SSL Certificate paths
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        # ======================================================================
        # TLS Configuration - Only TLSv1.2 and TLSv1.3 allowed
        # ======================================================================
        ssl_protocols TLSv1.2 TLSv1.3;
        
        # Strong cipher suites
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        
        # Prefer server ciphers
        ssl_prefer_server_ciphers off;

        # SSL session settings
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Document root
        root /var/www/html;

        # Index files
        index index.php index.html index.htm;

        # ==========================================================================
        # Location Blocks
        # ==========================================================================
        
        # Main location - try files, then directories, then pass to WordPress
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # PHP processing - pass to WordPress container via FastCGI
        location ~ \.php$ {
            # Split path info
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            
            # Pass to WordPress container on port 9000
            fastcgi_pass wordpress:9000;
            
            # Default index file
            fastcgi_index index.php;
            
            # Include FastCGI parameters
            include fastcgi_params;
            
            # Script filename
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            
            # Timeouts
            fastcgi_read_timeout 300;
            fastcgi_connect_timeout 300;
            fastcgi_send_timeout 300;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Static file caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|tar|gz|bmp|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
