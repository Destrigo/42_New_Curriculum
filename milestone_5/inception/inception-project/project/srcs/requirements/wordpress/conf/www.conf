; =============================================================================
; PHP-FPM Pool Configuration for WordPress
; =============================================================================

[www]

; Unix user/group of processes
user = nobody
group = nobody

; Listen on all interfaces, port 9000
; This allows connections from the nginx container
listen = 0.0.0.0:9000

; Process Manager Settings
; 'dynamic' spawns child processes as needed
pm = dynamic

; Maximum number of child processes
pm.max_children = 50

; Number of child processes created on startup
pm.start_servers = 5

; Minimum number of idle server processes
pm.min_spare_servers = 5

; Maximum number of idle server processes
pm.max_spare_servers = 35

; Maximum requests per child before respawning
pm.max_requests = 500

; =============================================================================
; PHP Settings
; =============================================================================

; Clear environment in workers
clear_env = no

; Catch worker output
catch_workers_output = yes

; Log errors
php_flag[display_errors] = off
php_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php83/error.log
php_admin_flag[log_errors] = on

; Memory limit
php_admin_value[memory_limit] = 256M

; Upload settings
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[max_input_vars] = 5000

; Session settings
php_admin_value[session.save_path] = /tmp

; OPcache settings (for performance)
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.interned_strings_buffer] = 8
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.revalidate_freq] = 2
