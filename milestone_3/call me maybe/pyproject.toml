[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding using small LLMs"
requires-python = ">=3.10,<3.13"

dependencies = [
    "numpy",
    "pydantic",
    "torch==2.2.2+cpu",
    "transformers",
    "huggingface-hub",
]

[tool.uv]
dev-dependencies = [
    "flake8",
    "mypy"
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    "__pycache__",
    ".venv",
    ".mypy_cache"
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
exclude = [
    "__pycache__",
    ".venv",
    ".mypy_cache"
]
