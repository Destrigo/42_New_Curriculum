[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "mlx @ file:///${PROJECT_ROOT}/libs/mlx-2.2-py3-none-any.whl",
]

[tool.setuptools]
py-modules = [
    "a_maze_ing",
    "config",
    "maze_algorithm_kruskals",
    "maze_algorithm_perfect",
    "maze_class_abc",
    "maze_generator",
    "maze_solver",
    "maze_types",
    "output_writer",
    "visualisation"
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
